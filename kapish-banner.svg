<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Kapish Rawat – BCA 1st year student, learning to code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1147"/>
      <stop offset="0.55" stop-color="#3a1c71"/>
      <stop offset="1" stop-color="#d76d77"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd8a8"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffaf7b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffaf7b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="400" rx="24"/></clipPath>
    <clipPath id="typeclip"><rect class="typebox" x="60" y="270" width="680" height="30"/></clipPath>
    <style>
      .mono{font-family:'Fira Code','JetBrains Mono',Consolas,Menlo,monospace}
      .sans{font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif}
      .fb{transform-box:fill-box}
      .float1{animation:f1 6s ease-in-out infinite}
      .float2{animation:f2 7s ease-in-out infinite}
      .float3{animation:f1 5s ease-in-out infinite 1s}
      .spin{transform-origin:1010px 200px;animation:spin 24s linear infinite}
      .spinr{transform-origin:1010px 200px;animation:spin 40s linear infinite reverse}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .cursor{animation:blink 1s steps(1) infinite}
      .twinkle{animation:tw 3s ease-in-out infinite}
      .sweep{animation:sweep 7s ease-in-out infinite}
      .glowmove{animation:gm 10s ease-in-out infinite alternate}
      .shoot{animation:shoot 6s linear infinite;opacity:0}
      .rise{animation:rise 9s linear infinite;opacity:0}
      .in1{opacity:0;animation:slide .9s cubic-bezier(.2,.8,.2,1) .2s forwards}
      .in2{opacity:0;animation:slide 1s cubic-bezier(.2,.8,.2,1) .6s forwards}
      .in3{opacity:0;animation:slide .9s cubic-bezier(.2,.8,.2,1) 1.2s forwards}
      .in4{opacity:0;animation:pop .7s cubic-bezier(.3,1.6,.5,1) 4.2s forwards}
      .in5{opacity:0;animation:pop .7s cubic-bezier(.3,1.6,.5,1) 4.5s forwards}
      .shimmer{animation:shim 4s ease-in-out infinite 2s}
      .typebox{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:typing 3s steps(50,end) 1.8s forwards}
      .cur2{opacity:0;animation:curshow 0s 1.8s forwards}
      .line{transform-box:fill-box;transform-origin:left center;animation:code 4s ease-in-out infinite}
      .wave{display:inline-block;transform-box:fill-box;transform-origin:70% 80%;animation:wave 2.2s ease-in-out infinite 1.5s}
      .bounce{animation:bounce 2.5s ease-in-out infinite}
      .dot{animation:blink 1.2s steps(1) infinite}
      .underline{stroke-dasharray:560;stroke-dashoffset:560;animation:draw 1.5s ease-out 1.1s forwards}
      @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes blink{50%{opacity:0}}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes sweep{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1300px)}}
      @keyframes gm{from{transform:translateX(-60px)}to{transform:translateX(40px)}}
      @keyframes shoot{0%{transform:translate(0,0);opacity:0}4%{opacity:1}22%{transform:translate(520px,260px);opacity:0}100%{transform:translate(520px,260px);opacity:0}}
      @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-430px);opacity:0}}
      @keyframes slide{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
      @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @keyframes shim{0%{transform:translateX(-400px)}50%,100%{transform:translateX(700px)}}
      @keyframes typing{to{transform:scaleX(1)}}
      @keyframes curshow{to{opacity:1}}
      @keyframes code{0%{transform:scaleX(0)}30%,80%{transform:scaleX(1)}100%{transform:scaleX(0)}}
      @keyframes wave{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-8deg)}45%{transform:rotate(16deg)}60%{transform:rotate(0)}}
      @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.typebox{transform:scaleX(1)}.shoot,.rise{opacity:0!important}.underline{stroke-dashoffset:0}}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <circle class="glowmove" cx="1010" cy="200" r="260" fill="url(#glow)"/>
    <circle class="pulse" cx="1010" cy="200" r="200" fill="url(#glow)" opacity=".5"/>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle class="twinkle" cx="80" cy="60" r="2"/>
      <circle class="twinkle" cx="300" cy="35" r="1.6" style="animation-delay:.6s"/>
      <circle class="twinkle" cx="520" cy="70" r="2" style="animation-delay:1.2s"/>
      <circle class="twinkle" cx="700" cy="30" r="1.5" style="animation-delay:1.8s"/>
      <circle class="twinkle" cx="640" cy="360" r="2" style="animation-delay:.3s"/>
      <circle class="twinkle" cx="140" cy="375" r="1.6" style="animation-delay:2s"/>
      <circle class="twinkle" cx="1150" cy="50" r="2" style="animation-delay:1s"/>
      <circle class="twinkle" cx="1140" cy="370" r="1.6" style="animation-delay:1.5s"/>
    </g>

    <!-- shooting stars -->
    <g>
      <rect class="shoot" x="100" y="-20" width="90" height="2.5" rx="1.5" fill="url(#shoot)" transform="rotate(27 100 -20)" style="animation-delay:1s"/>
      <rect class="shoot" x="420" y="-30" width="70" height="2" rx="1" fill="url(#shoot)" transform="rotate(27 420 -30)" style="animation-delay:3.5s"/>
      <rect class="shoot" x="-40" y="60" width="80" height="2" rx="1" fill="url(#shoot)" transform="rotate(27 -40 60)" style="animation-delay:5s"/>
    </g>

    <!-- rising bubbles -->
    <g fill="#fff">
      <circle class="rise" cx="400" cy="410" r="4" style="animation-delay:0s"/>
      <circle class="rise" cx="560" cy="410" r="3" style="animation-delay:2.5s"/>
      <circle class="rise" cx="760" cy="410" r="5" style="animation-delay:5s"/>
      <circle class="rise" cx="250" cy="410" r="3" style="animation-delay:6.5s"/>
      <circle class="rise" cx="900" cy="410" r="3.5" style="animation-delay:3.5s"/>
      <circle class="rise" cx="1100" cy="410" r="4" style="animation-delay:1.2s"/>
    </g>

    <!-- orbit rings + planets -->
    <g fill="none" stroke="#fff" stroke-opacity=".25">
      <circle class="spinr" cx="1010" cy="200" r="150" stroke-dasharray="4 8"/>
      <circle cx="1010" cy="200" r="105"/>
    </g>
    <g class="spin">
      <circle cx="1160" cy="200" r="9" fill="#ffd8a8"/>
      <circle cx="905" cy="200" r="6" fill="#7ee8fa"/>
      <circle cx="1010" cy="95" r="5" fill="#ff9ec4"/>
    </g>

    <!-- code card -->
    <g class="float1">
      <rect x="935" y="140" width="150" height="120" rx="14" fill="#120a33" fill-opacity=".85" stroke="#fff" stroke-opacity=".3"/>
      <circle cx="953" cy="158" r="4" fill="#ff5f56"/>
      <circle cx="967" cy="158" r="4" fill="#ffbd2e"/>
      <circle cx="981" cy="158" r="4" fill="#27c93f"/>
      <text class="mono" x="950" y="195" font-size="20" fill="#7ee8fa">&lt;/&gt;</text>
      <rect class="line" x="950" y="212" width="90" height="6" rx="3" fill="#ffd8a8" opacity=".85"/>
      <rect class="line" x="950" y="226" width="60" height="6" rx="3" fill="#d76d77" style="animation-delay:.4s"/>
      <rect class="line" x="950" y="240" width="75" height="6" rx="3" fill="#7ee8fa" opacity=".8" style="animation-delay:.8s"/>
    </g>

    <!-- floating chips -->
    <g class="float2">
      <rect x="800" y="90" width="78" height="34" rx="17" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".4"/>
      <text class="mono" x="839" y="112" font-size="15" fill="#fff" text-anchor="middle">C++</text>
    </g>
    <g class="float3">
      <rect x="1090" y="95" width="82" height="34" rx="17" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".4"/>
      <text class="mono" x="1131" y="117" font-size="15" fill="#fff" text-anchor="middle">Python</text>
    </g>
    <g class="float1" style="animation-delay:.5s">
      <rect x="820" y="285" width="70" height="34" rx="17" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".4"/>
      <text class="mono" x="855" y="307" font-size="15" fill="#fff" text-anchor="middle">HTML</text>
    </g>
    <g class="float2" style="animation-delay:1s">
      <rect x="1075" y="285" width="62" height="34" rx="17" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".4"/>
      <text class="mono" x="1106" y="307" font-size="15" fill="#fff" text-anchor="middle">Git</text>
    </g>

    <!-- text -->
    <g class="in1">
      <text class="mono" x="60" y="95" font-size="22" fill="#ffd8a8">&gt; hello, world! I'm</text>
      <text class="wave fb" x="300" y="97" font-size="24">👋</text>
    </g>
    <g class="in2">
      <text class="sans" x="58" y="175" font-size="76" font-weight="800" fill="url(#name)">Kapish Rawat</text>
    </g>
    <path class="underline" d="M60 195 H620" stroke="#7ee8fa" stroke-width="4" stroke-linecap="round" fill="none"/>
    <g class="in3">
      <text class="sans" x="60" y="248" font-size="28" font-weight="600" fill="#fff">BCA 1st Year Student</text>
    </g>

    <!-- typewriter tagline -->
    <g clip-path="url(#typeclip)">
      <text class="mono" x="60" y="292" font-size="20" fill="#fff" fill-opacity=".9">Learning. Building. Breaking things &amp; fixing them.</text>
    </g>
    <text class="mono cursor" x="666" y="292" font-size="20" fill="#7ee8fa" style="opacity:1">▌</text>

    <!-- badges -->
    <g class="sans" font-size="15" font-weight="600">
      <g class="in4 fb" style="transform-origin:135px 340px">
        <g class="bounce">
          <rect x="60" y="322" width="150" height="36" rx="18" fill="#7ee8fa"/>
          <circle class="dot" cx="82" cy="340" r="5" fill="#1b9e5a"/>
          <text x="148" y="345" text-anchor="middle" fill="#1b1147">Open to learn</text>
        </g>
      </g>
      <g class="in5 fb" style="transform-origin:319px 340px">
        <g class="bounce" style="animation-delay:.4s">
          <rect x="224" y="322" width="190" height="36" rx="18" fill="none" stroke="#fff" stroke-opacity=".6"/>
          <text x="319" y="345" text-anchor="middle" fill="#fff">Open to collab</text>
        </g>
      </g>
    </g>

    <!-- light sweep over everything -->
    <rect class="sweep" x="0" y="0" width="300" height="400" fill="url(#sweep)" transform="skewX(-20)"/>
  </g>
</svg>
